<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" role="img" aria-labelledby="f1-t f1-d" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title id="f1-t">그림 1. 이렇게 조사했어요</title>
<desc id="f1-d">기업마당 공고 200건을 뽑아 AI 비서에게 한국어로 묻고, 답에서 마감일·신청 가능 여부·수행 기관을 규칙으로 뽑아 공고 목록과 맞춰 본 순서</desc>
<rect width="360" height="448" fill="#FBFAF7"/>
<circle cx="28" cy="36" r="12" fill="#0A6797"/>
<text x="28" y="41" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="52" y="42" font-size="16" font-weight="700" fill="#141414" text-anchor="start">지원사업 공고 200건을 뽑았어요</text>
<text x="52" y="64" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">기업마당 목록에서 진행 중 100건, 마감 100건</text>
<text x="52" y="84" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">(중앙부처 100건, 지자체 100건)</text>
<line x1="28" y1="52" x2="28" y2="106" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="124" r="12" fill="#0A6797"/>
<text x="28" y="129" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="52" y="130" font-size="16" font-weight="700" fill="#141414" text-anchor="start">공고마다 똑같이 물었어요</text>
<text x="52" y="152" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">"지금 신청할 수 있나요? 마감일과 수행 기관은요?"</text>
<text x="52" y="172" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">한국어로, 공고 이름 그대로</text>
<line x1="28" y1="140" x2="28" y2="194" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="212" r="12" fill="#0A6797"/>
<text x="28" y="217" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="52" y="218" font-size="16" font-weight="700" fill="#141414" text-anchor="start">웹 검색을 쓰는 AI 비서가 답했어요</text>
<text x="52" y="240" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">Claude Sonnet, 문항마다 검색</text>
<line x1="28" y1="228" x2="28" y2="262" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="280" r="12" fill="#0A6797"/>
<text x="28" y="285" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="52" y="286" font-size="16" font-weight="700" fill="#141414" text-anchor="start">답에서 세 가지를 뽑았어요</text>
<text x="52" y="308" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">마감일, 신청 가능 여부(돼요·끝났어요·모름), 수행</text>
<text x="52" y="328" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">기관</text>
<line x1="28" y1="296" x2="28" y2="350" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="368" r="12" fill="#0A6797"/>
<text x="28" y="373" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="52" y="374" font-size="16" font-weight="700" fill="#141414" text-anchor="start">공고 목록과 맞춰 봤어요</text>
<text x="52" y="396" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">답 200개를 기업마당 공고의 신청 마감일·상태·수행</text>
<text x="52" y="416" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">기관과 비교했어요</text>
</svg>
