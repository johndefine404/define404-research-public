<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 331" role="img" aria-labelledby="f5-t f5-d" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title id="f5-t">그림 5. 판단을 미루는 AI와 틀리게 단정하는 AI</title>
<desc id="f5-d">Claude 계열은 폐업 가게를 영업 중이라고 하지 않았지만 영업 중인 가게도 거의 알려 주지 않았고, Llama는 폐업 가게에 단정한 답의 대부분이 영업 중이라는 오답</desc>
<rect width="360" height="331" fill="#FBFAF7"/>
<rect x="10.5" y="14.5" width="339" height="154" rx="2" fill="#FFFFFF" stroke="#D6D1C7"/>
<text x="26" y="40" font-size="14" font-weight="700" fill="#141414" text-anchor="start">Claude 계열</text>
<text x="334" y="40" font-size="14" font-weight="700" fill="#6E6A63" text-anchor="end">"확인할 수 없어요"</text>
<line x1="26" y1="54" x2="334" y2="54" stroke="#D6D1C7"/>
<rect x="26" y="69" width="7" height="7" rx="1" fill="#0A6797"/>
<text x="40" y="78" font-size="13" font-weight="500" fill="#4A4844" text-anchor="start">폐업한 가게를 영업 중이라고 한 답: 2,500번 중 0번</text>
<rect x="26" y="92" width="7" height="7" rx="1" fill="#0A6797"/>
<text x="40" y="101" font-size="13" font-weight="500" fill="#4A4844" text-anchor="start">손님이 헛걸음할 일은 거의 없어요</text>
<rect x="26" y="115" width="7" height="7" rx="1" fill="#DA2D2D"/>
<text x="40" y="124" font-size="13" font-weight="500" fill="#4A4844" text-anchor="start">영업 중인 가게를 영업 중이라고 한 답: 2,500번 중 1번</text>
<rect x="26" y="138" width="7" height="7" rx="1" fill="#DA2D2D"/>
<text x="40" y="147" font-size="13" font-weight="500" fill="#4A4844" text-anchor="start">문을 연 가게도 AI 답에는 나오지 않아요</text>
<rect x="10.5" y="180.5" width="339" height="108" rx="2" fill="#FFFFFF" stroke="#D6D1C7"/>
<text x="26" y="206" font-size="14" font-weight="700" fill="#141414" text-anchor="start">Llama 3.1 8B</text>
<text x="334" y="206" font-size="14" font-weight="700" fill="#DA2D2D" text-anchor="end">"영업 중이에요"</text>
<line x1="26" y1="220" x2="334" y2="220" stroke="#D6D1C7"/>
<rect x="26" y="235" width="7" height="7" rx="1" fill="#DA2D2D"/>
<text x="40" y="244" font-size="13" font-weight="500" fill="#4A4844" text-anchor="start">폐업한 가게에 딱 잘라 말한 81번 중 59번이 "영업 중"</text>
<rect x="26" y="258" width="7" height="7" rx="1" fill="#DA2D2D"/>
<text x="40" y="267" font-size="13" font-weight="500" fill="#4A4844" text-anchor="start">그 말을 믿은 손님은 헛걸음을 해요</text>
<text x="16" y="308" font-size="12" font-weight="500" fill="#6E6A63" text-anchor="start">파란 점은 가게와 손님에게 좋은 점, 빨간 점은 문제예요</text>
</svg>
