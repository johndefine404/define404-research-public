<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 428" role="img" aria-labelledby="f1-t f1-d" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title id="f1-t">그림 1. 이렇게 조사했어요</title>
<desc id="f1-d">음식점 800곳을 뽑아 5개 언어로 묻고, AI 네 가지의 답을 영업, 폐업, 모름으로 나눠 실제 영업 상태와 맞춰 본 순서</desc>
<rect width="360" height="428" fill="#FBFAF7"/>
<circle cx="28" cy="36" r="12" fill="#0A6797"/>
<text x="28" y="41" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="52" y="42" font-size="16" font-weight="700" fill="#141414" text-anchor="start">음식점 800곳을 뽑았어요</text>
<text x="52" y="64" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">공공 인허가 자료에서 영업 중 400곳, 폐업 400곳</text>
<line x1="28" y1="52" x2="28" y2="86" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="104" r="12" fill="#0A6797"/>
<text x="28" y="109" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="52" y="110" font-size="16" font-weight="700" fill="#141414" text-anchor="start">가게마다 똑같이 물었어요</text>
<text x="52" y="132" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">"지금도 영업해요? 주소와 업종은요?" 한국어, 영어,</text>
<text x="52" y="152" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">일본어, 중국어, 베트남어로</text>
<line x1="28" y1="120" x2="28" y2="174" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="192" r="12" fill="#0A6797"/>
<text x="28" y="197" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="52" y="198" font-size="16" font-weight="700" fill="#141414" text-anchor="start">AI 네 가지가 답했어요</text>
<text x="52" y="220" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">Claude Haiku(기억만, 웹 검색), Claude</text>
<text x="52" y="240" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">Sonnet(웹 검색), Llama 3.1 8B(기억만)</text>
<line x1="28" y1="208" x2="28" y2="262" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="280" r="12" fill="#0A6797"/>
<text x="28" y="285" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="52" y="286" font-size="16" font-weight="700" fill="#141414" text-anchor="start">답을 세 갈래로 나눴어요</text>
<text x="52" y="308" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">영업 중이래요, 폐업했대요, 모른대요</text>
<line x1="28" y1="296" x2="28" y2="330" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="348" r="12" fill="#0A6797"/>
<text x="28" y="353" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="52" y="354" font-size="16" font-weight="700" fill="#141414" text-anchor="start">정답과 맞춰 봤어요</text>
<text x="52" y="376" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">답 7,312개를 인허가 자료의 실제 영업 상태와</text>
<text x="52" y="396" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">비교했어요</text>
</svg>
