<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" role="img" aria-labelledby="f1-t f1-d" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title id="f1-t">그림 1. 이렇게 조사했어요</title>
<desc id="f1-d">지난 조사의 답 4,000개를 다시 꺼내, 질문을 먼저 기록하고, 답마다 업종을 말했는지 표시한 뒤, 5개 언어 답이 갖춰진 612곳에서 언어끼리 비교한 순서</desc>
<rect width="360" height="468" fill="#FBFAF7"/>
<circle cx="28" cy="36" r="12" fill="#0A6797"/>
<text x="28" y="41" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="52" y="42" font-size="16" font-weight="700" fill="#141414" text-anchor="start">지난 조사의 답을 다시 꺼냈어요</text>
<text x="52" y="64" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">음식점 800곳에 5개 언어로 물어 받은 Claude</text>
<text x="52" y="84" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">Haiku의 답 4,000개. 새로 묻지 않았어요</text>
<line x1="28" y1="52" x2="28" y2="106" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="124" r="12" fill="#0A6797"/>
<text x="28" y="129" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="52" y="130" font-size="16" font-weight="700" fill="#141414" text-anchor="start">보기 전에 질문을 먼저 적었어요</text>
<text x="52" y="152" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">"한국어로 물으면 업종을 더 자주 말할까?" 답을 보기</text>
<text x="52" y="172" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">전에 저장소에 기록했어요</text>
<line x1="28" y1="140" x2="28" y2="194" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="212" r="12" fill="#0A6797"/>
<text x="28" y="217" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="52" y="218" font-size="16" font-weight="700" fill="#141414" text-anchor="start">답마다 업종을 말했는지 표시했어요</text>
<text x="52" y="240" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">말했으면 1, 안 했으면 0. 판정은 지난 조사 것을</text>
<text x="52" y="260" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">그대로 썼어요</text>
<line x1="28" y1="228" x2="28" y2="282" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="300" r="12" fill="#0A6797"/>
<text x="28" y="305" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="52" y="306" font-size="16" font-weight="700" fill="#141414" text-anchor="start">가게마다 언어끼리 비교했어요</text>
<text x="52" y="328" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">5개 언어 답이 다 갖춰진 612곳. 업태가 기타인</text>
<text x="52" y="348" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">가게의 답 940개는 뺐어요</text>
<line x1="28" y1="316" x2="28" y2="370" stroke="#B9B3A7" stroke-width="1.5"/>
<circle cx="28" cy="388" r="12" fill="#0A6797"/>
<text x="28" y="393" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="52" y="394" font-size="16" font-weight="700" fill="#141414" text-anchor="start">차이와 오차 범위를 쟀어요</text>
<text x="52" y="416" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">한국어 대 나머지 4개 언어 평균. 웹 검색 조건과</text>
<text x="52" y="436" font-size="13.5" font-weight="500" fill="#4A4844" text-anchor="start">카카오 등록 여부도 같이 봤어요</text>
</svg>
