<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="f3-t f3-d" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title id="f3-t">그림 3. 비슷한 답까지 쳐 주면</title>
<desc id="f3-d">똑같이 적은 답은 영어 18.3%, 일본어 18.3%로 같은데, 비슷하게라도 적은 답은 영어 75.0%, 일본어 40.0%</desc>
<rect width="360" height="320" fill="#FBFAF7"/>
<text x="16" y="24" font-size="16" font-weight="700" fill="#141414" text-anchor="start">똑같이 적은 답</text>
<text x="16" y="54" font-size="13.5" font-weight="600" fill="#4A4844" text-anchor="start">영어</text>
<rect x="72.0" y="36" width="49.9" height="26" fill="#0A6797"/>
<text x="127.86666666666666" y="54" font-size="14" font-weight="700" fill="#141414" text-anchor="start">18.3%</text>
<text x="16" y="88" font-size="13.5" font-weight="600" fill="#4A4844" text-anchor="start">일본어</text>
<rect x="72.0" y="70" width="49.9" height="26" fill="#0A6797"/>
<text x="127.86666666666666" y="88" font-size="14" font-weight="700" fill="#141414" text-anchor="start">18.3%</text>
<text x="16" y="126" font-size="16" font-weight="700" fill="#141414" text-anchor="start">비슷하게라도 적은 답</text>
<text x="16" y="156" font-size="13.5" font-weight="600" fill="#4A4844" text-anchor="start">영어</text>
<rect x="72.0" y="138" width="49.9" height="26" fill="#0A6797"/>
<rect x="121.9" y="138" width="154.1" height="26" fill="#7FB2CC"/>
<text x="282.0" y="156" font-size="14" font-weight="700" fill="#141414" text-anchor="start">75.0%</text>
<text x="16" y="190" font-size="13.5" font-weight="600" fill="#4A4844" text-anchor="start">일본어</text>
<rect x="72.0" y="172" width="49.9" height="26" fill="#0A6797"/>
<rect x="121.9" y="172" width="58.9" height="26" fill="#7FB2CC"/>
<text x="186.8" y="190" font-size="14" font-weight="700" fill="#141414" text-anchor="start">40.0%</text>
<rect x="16" y="224" width="11" height="11" rx="2" fill="#0A6797"/>
<text x="33" y="234" font-size="12.5" font-weight="500" fill="#4A4844" text-anchor="start">똑같아요</text>
<rect x="110" y="224" width="11" height="11" rx="2" fill="#7FB2CC"/>
<text x="127" y="234" font-size="12.5" font-weight="500" fill="#4A4844" text-anchor="start">비슷해요</text>
<line x1="16" y1="250" x2="344" y2="250" stroke="#D6D1C7"/>
<text x="16" y="272" font-size="14" font-weight="700" fill="#141414" text-anchor="start">비슷한 답까지 쳐 주면 영어는 크게 늘고 일본어는 덜</text>
<text x="16" y="292" font-size="14" font-weight="700" fill="#141414" text-anchor="start">늘어요</text>
</svg>
