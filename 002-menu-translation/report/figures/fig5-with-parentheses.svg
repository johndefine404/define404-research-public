<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" role="img" aria-labelledby="f5-t f5-d" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title id="f5-t">그림 5. 괄호 안 설명까지 보면</title>
<desc id="f5-d">본 이름만 보면 표준과 똑같은 답이 영어 18.3%, 일본어 18.3%인데, 괄호 안 설명까지 포함하면 표준 이름이 들어 있는 답이 영어 37.2%, 일본어 28.3%</desc>
<rect width="360" height="334" fill="#FBFAF7"/>
<text x="16" y="24" font-size="16" font-weight="700" fill="#141414" text-anchor="start">영어</text>
<text x="16" y="54" font-size="13" font-weight="600" fill="#4A4844" text-anchor="start">본 이름만</text>
<rect x="86.0" y="36" width="49.9" height="26" fill="#0A6797"/>
<text x="141.86666666666667" y="54" font-size="14" font-weight="700" fill="#141414" text-anchor="start">18.3%</text>
<text x="16" y="86" font-size="13" font-weight="600" fill="#4A4844" text-anchor="start">괄호까지</text>
<rect x="86.0" y="68" width="101.2" height="26" fill="#7FB2CC"/>
<text x="193.2384" y="86" font-size="14" font-weight="700" fill="#141414" text-anchor="start">37.2%</text>
<text x="16" y="124" font-size="16" font-weight="700" fill="#141414" text-anchor="start">일본어</text>
<text x="16" y="154" font-size="13" font-weight="600" fill="#4A4844" text-anchor="start">본 이름만</text>
<rect x="86.0" y="136" width="49.9" height="26" fill="#0A6797"/>
<text x="141.86666666666667" y="154" font-size="14" font-weight="700" fill="#141414" text-anchor="start">18.3%</text>
<text x="16" y="186" font-size="13" font-weight="600" fill="#4A4844" text-anchor="start">괄호까지</text>
<rect x="86.0" y="168" width="77.1" height="26" fill="#7FB2CC"/>
<text x="169.05759999999998" y="186" font-size="14" font-weight="700" fill="#141414" text-anchor="start">28.3%</text>
<text x="16" y="224" font-size="12" font-weight="500" fill="#6E6A63" text-anchor="start">본 이름만: 괄호 밖 이름이 표준과 똑같은 답. 괄호까지: 괄호 안</text>
<text x="16" y="241" font-size="12" font-weight="500" fill="#6E6A63" text-anchor="start">설명을 포함한 메뉴명 줄 어딘가에 표준 이름이 있는 답</text>
<line x1="16" y1="264" x2="344" y2="264" stroke="#D6D1C7"/>
<text x="16" y="286" font-size="14" font-weight="700" fill="#141414" text-anchor="start">괄호까지 봐도 영어 열에 여섯, 일본어 열에 일곱은 표준</text>
<text x="16" y="306" font-size="14" font-weight="700" fill="#141414" text-anchor="start">이름이 없어요</text>
</svg>
